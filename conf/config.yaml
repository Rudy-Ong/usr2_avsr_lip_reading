defaults:
  - data: default
  - debug: no_debug
  - decode: default
  - logger: default
  - logging: default
  - model: default
  - trainer: test
hydra:
  output_subdir: null
  run:
    dir: .
project_name: usr2
num_workers: 4
log_wandb: False
compile_model: True
gpus:
video:
modality: av # a for audio, v for video, av for audio-video
detector: mediapipe #retinaface or mediapipe
output: features.pt
use_csv_eval: False # Whether to use CSV file for evaluation. If False, the model will be evaluated on the fly.
csv_path: 
max_rows: -1 #-1 for all rows change to 5 for only 5 rows
mouth_roi_root: data/mouth_roi_with_audio # if already processed
audio_root: data/audio # Added for audio modality
use_mouth_roi_input: True # Whether to use mouth ROI as input to the model. If False, the full frame will be used.
snr_levels: "0,5,10" # comma-separated SNR levels (dB) for scripts/run_noise_eval.py
noise_path: data/noise/babble_noise.npy # noise source for scripts/run_noise_eval.py
out_dir: csv # report/summary output directory for scripts/run_noise_eval.py
seed: 42 # random seed for scripts/run_noise_eval.py's noise-crop reproducibility